apply plugin: 'com.android.application'

android {
    namespace "bg.ngerchev.fit.wear"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // Същото applicationId и същият подпис като телефона — изискване на Wear OS Data Layer
        applicationId "bg.ngerchev.fit"
        minSdkVersion 30
        targetSdkVersion 34
        def vc = System.getenv("VERSION_CODE") ?: "1"
        versionCode Integer.parseInt(vc)
        versionName "1.0." + vc
    }
    signingConfigs {
        release {
            storeFile file("../keystore/fit-release.jks")
            storePassword System.getenv("FIT_STORE_PASSWORD") ?: "fit-release-2026"
            keyAlias System.getenv("FIT_KEY_ALIAS") ?: "fit"
            keyPassword System.getenv("FIT_KEY_PASSWORD") ?: "fit-release-2026"
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-wearable:19.0.0"
}
