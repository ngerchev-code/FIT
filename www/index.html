const FIT_RELEASES_API = "https://api.github.com/repos/ngerchev-code/FIT/releases?per_page=6";
async function updateReminders(){
  if(!NATIVE) return;
  const LN=Plug("LocalNotifications"); const st=updState(); const now=Date.now();
  try{
    const me=BUILD||await myBuild(); if(!REL||now-(st.lastCheck||0)>6*3600e3){ await latestRelease(); st.lastCheck=now; }
    if(!REL) return;
    const nat=await nativeBuild();
    // броим напомнянето за голямо обновление като „изпратено“ едва когато времето му мине
    if(st.apkFor!==REL.code){ st.apkFor=REL.code; st.apkCount=0; st.apkAt=0; }
    else if(st.apkAt && now>=st.apkAt){ st.apkCount=(st.apkCount||0)+1; st.apkAt=0; }
    const plan=FC.updatePlan({now, latest:REL.code, installed:me, minNative:REL.minNative, nativeBuild:nat, news:REL.news, state:st, consent:allowed2("notif")});
    st.pendingApk = plan.action==="apk" ? REL.code : 0; st.lastNews=REL.news||[]; save();
    if(!LN) return;
    const keepApk = plan.action==="apk" && st.apkAt && now<st.apkAt;
    await LN.cancel({notifications:[{id:7721}].concat(keepApk?[]:[{id:7720}])});
    const list=plan.notify.filter(n=>!(n.kind==="apk"&&keepApk));
    list.forEach(n=>{ if(n.kind==="apk") st.apkAt=n.at; }); save();
    if(list.length) await LN.schedule({notifications:list.map(n=>({id:n.id,title:n.title,body:n.body,channelId:"fit_drop",sound:"drop.wav",schedule:{at:new Date(n.at),allowWhileIdle:true}}))});
  }catch(e){}
}
function newsBullets(body){ return ((body||"").split("### Какво ново")[1]||"").split("\n").filter(l=>l.startsWith("- ")).map(l=>l.slice(2).trim()).slice(0,6); }
async function newsSheet(){
  const st=updState();
  const paint=(rels,err)=>sheet(`<div class="grab"></div><p class="eyebrow">Новости и версии</p><div class="h2">Какво ново във FIT</div>
    <p class="muted" style="margin:0">Твоята версия: <b>1.0.${BUILD||"?"}</b>${st.pendingApk?` · налична е <b>1.0.${st.pendingApk}</b> (иска инсталация)`:""}</p>
    ${rels?rels.map(r=>{ const code=(/(\d+)$/.exec(r.tag_name||"")||[])[1]; const b=newsBullets(r.body); return `<div class="card" style="background:var(--surface-2);gap:4px"><b>1.0.${esc(code||"")} · ${esc((r.published_at||"").slice(0,10).split("-").reverse().join("."))}${+code===+BUILD?' <span class="pill good">твоята</span>':""}</b>${b.length?`<ul style="margin:4px 0 0;padding-left:18px">${b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<span class="muted">Подобрения и поправки.</span>'}</div>`; }).join(""):`<div class="thinking"><span class="spin"></span>${err?esc(err):"Зареждам новостите…"}</div>`}
    ${st.pendingApk?`<a class="btn hot block" href="${FIT_APK}" target="_blank" rel="noopener">Свали и инсталирай 1.0.${st.pendingApk}</a>`:""}
    <button class="btn block" id="nwChk" type="button">Провери за обновление сега</button><button class="btn ghost block" data-close type="button">Затвори</button>`, h=>{
      h.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
      $("#nwChk").onclick=()=>{ closeSheet(); checkUpdates(true).then(updateReminders); };
    });
  paint(null);
  try{ const r=await fetch(FIT_RELEASES_API,{cache:"no-store"}); if(!r.ok) throw 0; const rels=(await r.json()).filter(x=>!x.draft).slice(0,6);
    const top=(/(\d+)$/.exec((rels[0]||{}).tag_name||"")||[])[1]; if(top){ st.newsSeen=+top; save(); } paint(rels); }
  catch(e){ paint(null,"Няма връзка — опитай пак по-късно."); }
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.tab));
$("#menuBtn").onclick=openDrawer;

$("#chatFab").onclick=()=>{ if(P()) openChat(); };
document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ if($("#sheetHost").innerHTML) closeSheet(); show(g.dataset.go); } const nv=e.target.closest("[data-nav]"); if(nv){ const [n,q]=nv.dataset.nav.split("|"); navSheet(n,q); } });
$("#whoBtn").onclick=()=>{
  if(!S.people.length) return;
  sheet(`<div class="grab"></div><p class="eyebrow">Хора</p><div class="h2">Кой тренира сега?</div>
    <div style="display:flex;flex-direction:column;gap:8px">${S.people.map(x=>`<button class="person" type="button" data-pick="${x.id}" aria-pressed="${x.id===S.active}"><span class="ava">${esc(x.name.slice(0,1).toUpperCase())}</span>${esc(x.name)} <span class="muted" style="font-weight:600">· ${esc(goalName(x))}</span></button>`).join("")}</div>
    <button class="btn ghost block" id="addP2" type="button">+ Добави човек</button>`, host=>{
      host.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ S.active=b.dataset.pick; save(); closeSheet(); render(); });
      $("#addP2").onclick=()=>onboarding(true);
  });
};

// пример, докато човекът попълни филтъра — нищо не се записва
if(!S.people.length){
  S.people=[];
  const demo={id:"demo",name:"Гост",age:30,sex:"m",height:178,weight:84,goal:"fat",goals:["fat"],level:"new",days:3,minutes:50,limits:[],value:"disc",xp:0,streak:0,lastDone:"",log:{},gym:[],custom:[],start:todayISO(),mode:null,perVisit:6};
  S.people.push(demo); S.active="demo";
  render();
  S.people=[]; // не записваме госта
  setTimeout(()=>{ S.people=[]; if(S.consent) onboarding(false); else consentSheet(()=>onboarding(false)); },300);
} else { render(); if(!S.consent) consentSheet(()=>{ if(!missedCheck()) dailyPopup(); }); else if(!missedCheck()) dailyPopup(); }
if(NATIVE){ myBuild(); setTimeout(()=>{ if(P()) checkUpdates(false); }, 8000); }


/* ============ PWA (iPhone и браузър) ============ */
if(!NATIVE && "serviceWorker" in navigator && location.protocol==="https:" && !/claude|anthropic/.test(location.hostname)){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
/* ============ ANDROID ============ */
async function openLink(url){ const B=Plug("Browser"); if(NATIVE&&B){ try{ await B.open({url}); return; }catch(e){} } window.open(url,"_blank","noopener"); }
async function openMama(){
  const L=Plug("AppLauncher");
  const ios=IOS;
  const target=ios?"bg.ngerchev.mama://open":"bg.ngerchev.mama";
  if(L){ try{ const r=await L.canOpenUrl({url:target}); if(r&&r.value){ await L.openUrl({url:target}); return; } }catch(e){} }
  if(ios||!NATIVE&&/iPhone|iPad|iPod/.test(navigator.userAgent)){ openLink(MAMA_URL); return; }
  toast("MAMA","MAMA не е инсталирано на този телефон — отварям изтеглянето.");
  openLink(MAMA_APK);
}
if(NATIVE){
  document.addEventListener("click",e=>{ const a=e.target.closest("a[href]"); if(!a) return; const h=a.getAttribute("href"); if(!/^https?:/.test(h)) return; e.preventDefault(); if(a.hasAttribute("data-mama")) openMama(); else openLink(h); });
  const App=Plug("App");
  if(App) App.addListener("backButton",()=>{ if($("#sheetHost").innerHTML){ if(S.people.length) closeSheet(); return; } if(TAB!=="today"){ show("today"); return; } App.exitApp(); });
  const SB=Plug("StatusBar"); if(SB){ try{ SB.setOverlaysWebView({overlay:false}); SB.setBackgroundColor({color:matchMedia("(prefers-color-scheme: dark)").matches?"#151A22":"#FFFFFF"}); SB.setStyle({style:matchMedia("(prefers-color-scheme: dark)").matches?"DARK":"LIGHT"}); }catch(e){} }
}
(async()=>{
  try{
    DL = await window.claude?.use?.("downloads");
    const s = await window.claude?.use?.("sample");
    if(!s){ if(P()) render(); return; } SAMPLE=s;
    const lim = await s.limits().catch(()=>null);
    SAMPLE_IMG = !!lim?.images;
    if(P()) render();
  }catch(e){}
})();
try{ if(window.FCL) FCL.install(); }catch(e){ console.error(e); }
