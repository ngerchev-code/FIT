name: Android APK

on:
  push:
    branches: [main]
    paths: ["www/**", "android/**", "package.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      FIT_STORE_PASSWORD: ${{ secrets.FIT_STORE_PASSWORD }}
      FIT_KEY_PASSWORD: ${{ secrets.FIT_KEY_PASSWORD }}
      FIT_KEY_ALIAS: ${{ secrets.FIT_KEY_ALIAS }}
      FIT_KEYSTORE_B64: ${{ secrets.FIT_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Ключ за подписване от GitHub Secrets
        run: |
          if [ -n "$FIT_KEYSTORE_B64" ]; then
            echo "$FIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fit-upload.jks"
            echo "FIT_KEYSTORE_FILE=$RUNNER_TEMP/fit-upload.jks" >> "$GITHUB_ENV"
            echo "Подписване с ключа от Secrets."
          else
            echo "::warning::FIT_KEYSTORE_B64 не е зададен — подписвам със стария публичен ключ. Задай Secrets преди Google Play (docs/PLAY_RELEASE.md)."
          fi

      - name: Проверка на кода и тестове
        run: node tools/check.mjs

      - name: Зависимости и синхронизация
        run: |
          echo "MIN_NATIVE=$(cat android/NATIVE_VERSION)" >> "$GITHUB_ENV"
          echo "{\"code\": ${{ github.run_number }}}" > www/build.json
          npm ci
          (cd www && zip -qr ../web.zip .)
          {
            echo "FIT — Fitness Intelligent Team. Свали **FIT.apk** на телефона и го инсталирай."
            echo "Постоянен линк: https://github.com/ngerchev-code/fit/releases/latest/download/FIT.apk"
            echo "Инсталираното приложение получава новия код автоматично (web.zip) — без нова инсталация."
            echo "Часовник (Wear OS, напр. Galaxy Watch Ultra): **FIT-watch.apk** — инсталира се на часовника през Wear Installer / ADB."
            echo
            echo "### Какво ново"
            git log -1 --pretty=%B | grep -v -E "^(Co-Authored-By|Claude-Session):" | sed '/^$/d' | sed 's/^/- /'
            echo
            echo "minNative: $(cat android/NATIVE_VERSION)"
          } > release.md
          cat release.md
          npx cap sync android

      - name: Компилиране (APK + AAB за Google Play)
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../FIT-1.0.${VERSION_CODE}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../FIT-1.0.${VERSION_CODE}.aab
          cp app/build/outputs/apk/release/app-release.apk ../FIT.apk
          cp wear/build/outputs/apk/release/wear-release.apk ../FIT-watch.apk

      - name: Смяна на ключа без деинсталиране (APK key rotation, v3 + родословие)
        if: env.FIT_KEYSTORE_FILE != ''
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); SIGN="$BT/apksigner"
          echo "apksigner: $SIGN"
          # родословие: старият (публичен) ключ → новият ключ от Secrets
          "$SIGN" rotate --out "$RUNNER_TEMP/fit-lineage" \
            --old-signer --ks android/keystore/fit-release.jks --ks-key-alias fit --ks-pass pass:fit-release-2026 \
            --new-signer --ks "$FIT_KEYSTORE_FILE" --ks-key-alias "${FIT_KEY_ALIAS:-fit-upload}" --ks-pass env:FIT_STORE_PASSWORD
          for APK in FIT.apk FIT-1.0.${VERSION_CODE}.apk FIT-watch.apk; do
            "$SIGN" sign --rotation-min-sdk-version 28 --lineage "$RUNNER_TEMP/fit-lineage" \
              --ks android/keystore/fit-release.jks --ks-key-alias fit --ks-pass pass:fit-release-2026 \
              --next-signer --ks "$FIT_KEYSTORE_FILE" --ks-key-alias "${FIT_KEY_ALIAS:-fit-upload}" --ks-pass env:FIT_STORE_PASSWORD \
              "$APK"
            "$SIGN" verify --verbose --print-certs "$APK" | tee "verify-$APK.txt" | grep -E "Verified using v3 scheme|Number of signers|lineage" || true
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "verify-$APK.txt"
          done
          rm -f "$RUNNER_TEMP/fit-upload.jks" "$RUNNER_TEMP/fit-lineage"
          echo "Готово: инсталираните копия приемат новия ключ без деинсталиране (Android 9+)."

      - name: Издание (Release) с APK за сваляне от телефона
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FIT 1.0.${{ github.run_number }}
          make_latest: true
          body_path: release.md
          files: |
            FIT.apk
            FIT-watch.apk
            web.zip
            FIT-*.apk
            FIT-*.aab

      - name: Доклад при грешка
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Компилирането на APK #${{ github.run_number }} спря."
            echo
            echo '```'
            if [ -f gradle.log ]; then grep -nE "What went wrong|error:|FAILED|Exception" gradle.log | head -60; echo "-----"; tail -120 gradle.log; else echo "gradle.log липсва (грешката е преди компилирането)"; fi
            echo '```'
          } > report.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "APK грешка #${{ github.run_number }}" --body-file report.md || true
