<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2340E8">
<link rel="icon" href="icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen mobile app — top bar, scrolling view, fixed bottom tab bar; cards only for things you act on */
:root{
  --bg:#ECEEF2; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#10141B; --muted:#5A6371; --line:#D7DBE2;
  --accent:#2340E8; --accent-soft:#E3E7FF; --on-accent:#FFFFFF; --hot:#F2532E; --hot-soft:#FFE6DF;
  --good:#17905F; --good-soft:#DDF4EA; --warn:#B7791F;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#151A22; --surface-2:#1B212B; --ink:#ECEEF2; --muted:#98A1AE; --line:#272E39;
  --accent:#7088FF; --accent-soft:#1D2550; --on-accent:#0C0F14; --hot:#FF7756; --hot-soft:#3A1E17;
  --good:#3CCB8F; --good-soft:#14301F; --warn:#E3B04B; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#151A22; --surface-2:#1B212B; --ink:#ECEEF2; --muted:#98A1AE; --line:#272E39;
  --accent:#7088FF; --accent-soft:#1D2550; --on-accent:#0C0F14; --hot:#FF7756; --hot-soft:#3A1E17;
  --good:#3CCB8F; --good-soft:#14301F; --warn:#E3B04B; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.plate{width:22px;height:22px;border-radius:50%;border:5px solid var(--accent);position:relative}
.plate::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.logo>span:last-child{display:flex;flex-direction:column;line-height:1}
.logo-sub{font-family:var(--f-body);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.menu-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;flex:0 0 auto}
.drawer{background:var(--surface);width:min(300px,84vw);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.drawer-i{border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px;min-height:44px;line-height:1.3;display:block;width:100%}
.drawer-i:hover,.drawer-i:focus-visible{background:var(--accent-soft)}
.macros-lite{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}
.macros-lite div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.macros-lite b{display:block;font-size:16px}.macros-lite span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
.chat-fab{position:fixed;z-index:26;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px;border:0;background:var(--hot);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px color-mix(in srgb,var(--hot) 45%,transparent)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-size:12px}

/* views */
main{max-width:760px;margin:0 auto;padding-block:18px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6vw,30px);line-height:1.15}
.h2{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.25}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;background:var(--accent);color:var(--on-accent);min-height:46px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.hot{background:var(--hot);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btn{position:relative;overflow:hidden}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:200px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.good{background:var(--good-soft);color:var(--good)}

/* hero */
.hero{background:var(--ink);color:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:color-mix(in srgb,var(--surface) 65%,transparent)}
.slogan{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,7vw,34px);line-height:1.08;letter-spacing:-.01em}
.slogan em{font-style:normal;color:var(--hot)}
.hero-rings{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:22px solid color-mix(in srgb,var(--accent) 70%,transparent);opacity:.55;pointer-events:none}
.hero-rings::after{content:"";position:absolute;inset:26px;border-radius:50%;border:10px solid color-mix(in srgb,var(--surface) 18%,transparent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative}
.stat{background:color-mix(in srgb,var(--surface) 9%,transparent);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px}
.stat span{font-size:11px;opacity:.75;font-weight:700}
.xpbar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--surface) 15%,transparent);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--hot);border-radius:99px;transition:width .6s}

/* exercise list */
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:0}
.num{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted)}
.ex.done .num{background:var(--good);border-color:var(--good);color:#fff}
.ex.done .ex-name{text-decoration:line-through;color:var(--muted)}
.ex-name{font-weight:800}
.ex-meta{font-size:13px;color:var(--muted)}
.presc{font-family:var(--f-mono);font-size:13px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:inline-block;margin-top:4px}
.check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:900;color:transparent}
.ex.done .check{border-color:var(--good);color:var(--good)}

/* timeline / phases */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.phase{border-radius:10px;padding:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.phase b{display:block;font-size:13px}
.phase.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayb{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 0;text-align:center;font-weight:800;font-size:12px;display:flex;flex-direction:column;gap:2px;align-items:center}
.dayb small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:700}
.dayb.train{border-color:var(--accent)}
.dayb[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.dayb[aria-pressed="true"] small{color:inherit}
.dayb.today{box-shadow:inset 0 -3px 0 var(--hot)}

/* scanner */
.drop{border:2px dashed var(--line);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}
.drop.has{border-style:solid}
.preview{max-height:240px;border-radius:12px;object-fit:cover;width:100%}
.lens{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center}
.lens i{width:26px;height:26px;border-radius:50%;border:4px solid var(--on-accent)}
.equip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.eq{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:2px;min-height:62px}
.eq small{color:var(--muted);font-weight:600;font-size:11px}
.eq[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* supplements */
.supp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:520px){.supp{grid-template-columns:1fr}}
.supp > div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.supp ul{margin:0;padding-left:18px;font-size:13px}
.supp h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.note{font-size:12px;color:var(--muted)}

/* feed */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lk{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-decoration:none;color:var(--ink);font-weight:800}
.lk small{color:var(--muted);font-weight:600}
.lk:hover{border-color:var(--accent)}

/* mama */
.mama{background:var(--hot);color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mama .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,8vw,40px);line-height:1}
.plate-split{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;font-size:12px;font-weight:800}
.plate-split div{border-radius:10px;padding:10px 8px;background:var(--surface-2);border:1px solid var(--line)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.scan{color:var(--on-accent)}
.tab.scan span.fab{width:50px;height:50px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.tab.scan b{color:var(--muted);font-weight:800}
.tab.scan[aria-current="page"] b{color:var(--accent)}

/* toast + sheet */
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:40;width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;opacity:0;transition:.35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .tk{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hot)}
.toast button{margin-left:auto;background:none;border:0;color:inherit;opacity:.7;font-weight:900;font-size:18px;line-height:1}
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;min-height:46px;width:100%}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}
.badge-pop{font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center}
.center{text-align:center}
.pp{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.person{flex:0 0 auto;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);display:flex;gap:10px;align-items:center;font-weight:800}
.person[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.duo{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:8px;font-size:13px;align-items:center}
.duo > div{min-width:0}
.duo .hd{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tbl-wrap{overflow-x:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top"><div class="top-in">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Меню"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <div class="logo" aria-label="FIT — Fitness Intelligent Team"><span class="plate" aria-hidden="true"></span><span>FIT<small class="logo-sub">Fitness Intelligent Team</small></span></div>
  <button class="who" id="whoBtn" type="button" aria-label="Смени човек"><span class="ava" id="whoAva">?</span><span id="whoName">Профил</span></button>
</div></header>

<main id="main">
  <!-- ДНЕС -->
  <section class="view" id="v-today"></section>
  <!-- СКЕНЕР -->
  <section class="view" id="v-scan" hidden></section>
  <!-- ПРОГРАМА -->
  <section class="view" id="v-plan" hidden></section>
  <!-- МАМА -->
  <section class="view" id="v-mama" hidden></section>
  <!-- СВЯТ -->
  <section class="view" id="v-world" hidden></section>
</main>

<nav class="tabs" aria-label="Основно меню"><div class="tabs-in">
  <button class="tab" data-tab="today" aria-current="page" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Днес</button>
  <button class="tab" data-tab="plan" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Програма</button>
  <button class="tab scan" data-tab="scan" type="button"><span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg></span><b>Скенер</b></button>
  <button class="tab" data-tab="mama" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 13h6"/></svg>MAMA</button>
  <button class="tab" data-tab="world" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Свят</button>
</div></nav>

<div class="toast" id="toast" role="status" aria-live="polite"><div><div class="tk" id="toastK">Насока</div><div id="toastT"></div></div><button type="button" id="toastX" aria-label="Затвори">×</button></div>
<button class="chat-fab" id="chatFab" type="button" aria-label="Попитай FIT"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg></button>
<div id="sheetHost"></div>

<script>
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const Plug = n => (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins[n] : null;
/* ============ ДАННИ ============ */
const GOALS = {
  fat:{n:"Отслабване", mode:"burn", dir:"по-лек и по-бърз"},
  muscle:{n:"Мускулна маса", mode:"hyp", dir:"по-силен и по-обемен"},
  posture:{n:"Стойка и здрав гръб", mode:"health", dir:"изправен и без болки"},

/* ============ ЛОГИКА НА ПРОГРАМАТА ============ */
function weekNo(p){ const s=new Date(p.start+"T00:00:00"); const w=Math.floor((Date.now()-s)/(7*864e5))+1; return Math.max(1,Math.min(12,w)); }
function phaseIdx(w){ return w<=4?0:(w<=8?1:2); }
const PHASES = [["Адаптация","седм. 1–4","техника и навик"],["Натрупване","седм. 5–8","повече обем"],["Пробив","седм. 9–12","по-голяма тежест"]];
function goalsOf(p){ return (p.goals&&p.goals.length)?p.goals:[p.goal||"fat"]; }
function isRecomp(p){ const g=goalsOf(p); return g.includes("fat")&&g.includes("muscle"); }
function goalName(p){ return isRecomp(p) ? "Рекомпозиция"+(goalsOf(p).length>2?" + "+goalsOf(p).filter(x=>x!=="fat"&&x!=="muscle").map(x=>GOALS[x].n).join(" + "):"") : goalsOf(p).map(g=>GOALS[g].n).join(" + "); }
function goalDir(p){ const d=goalsOf(p).map(g=>GOALS[g].dir); return d.length>1? d.slice(0,-1).join(", ")+" и "+d[d.length-1] : d[0]; }
function autoMode(p){ const g=goalsOf(p), ph=phaseIdx(weekNo(p));
  if(g.includes("strength") && (!g.includes("muscle") || ph===2)) return "str";
  if(g.includes("muscle")) return "hyp";
  if(g.includes("fat")) return "burn";
  if(g.includes("tone")) return "end";
  return "health"; }
function modeOf(p){ return p.mode || autoMode(p); }
const POSTURE_RX=/Лицево|Обратно разпъване|широк хват|Хиперекстензии|Pallof/;
function presc(p, group){
  const ph = phaseIdx(weekNo(p));
  if(group==="cardio"){
    const m=modeOf(p);
    if(m==="burn") return ["12–20 мин", "интервали"];
    if(m==="health") return ["10–15 мин","леко"];
    return ["8–12 мин","разхлаждане"];
  }
  const M = MODES[modeOf(p)];
  let sets = M.sets[ph];
  if(p.level==="new" && ph===0) sets = Math.max(2, sets-1);
  if(p.age>=55) sets = Math.min(sets,3);
  let rest = M.rest;
  if(p.limits.includes("bp") && modeOf(p)==="str") return [sets+" × 6–8", "2 мин, без задържане на дъха"];
  return [sets+" × "+M.reps, rest];
}
function allowed(ex, p){ if(!ex[4]) return true; return !ex[4].split(",").some(f=>p.limits.includes(f)); }
function pool(p){
  const out=[];
  const gym = p.gym && p.gym.length ? p.gym : Object.keys(LIB);
  gym.forEach(id=>{
    const e = LIB[id] || (p.custom||[]).find(c=>c.id===id);
    if(!e) return;
    e.ex.forEach((x,i)=>{ if(allowed(x,p)) out.push({eq:id, eqn:e.n, ex:x, key:id+":"+i}); });
  });
  return out;
}
function buildDay(p, dayIdx){
  const split = SPLITS[p.days][dayIdx % SPLITS[p.days].length];
  let tpl = TEMPLATES[split].slice();
  if(goalsOf(p).includes("posture")){ tpl.splice(1,0,"posture"); tpl.splice(5,0,"posture"); }
  tpl = tpl.slice(0, Math.max(4, Math.min(10, p.perVisit)));
  const pl = pool(p);
  const usedEq = new Set(), usedEx = new Set(), list=[];
  const offset = dayIdx*3 + weekNo(p);
  tpl.forEach((g,slot)=>{
    let cands = pl.filter(c=>(g==="posture"? POSTURE_RX.test(c.ex[0]) : c.ex[2]===g) && !usedEx.has(c.key));
    if(!cands.length) return;
    let fresh = cands.filter(c=>!usedEq.has(c.eq));
    const arr = fresh.length ? fresh : cands;
    const pick = arr[(offset+slot*7) % arr.length];
    usedEq.add(pick.eq); usedEx.add(pick.key);
    list.push(pick);
  });
  // кардио винаги накрая
  list.sort((a,b)=>(a.ex[2]==="cardio")-(b.ex[2]==="cardio"));
  return {split, list};
}
function trainingDays(p){ return SCHED[p.days]; }
function dayIndexFor(p, dow){ return trainingDays(p).indexOf(dow); }

const LEVELS = ["Новак","Редовен","Упорит","Силен","Атлет","Легенда"];
function lvl(p){ const l=Math.floor(p.xp/200); return {i:l, name:LEVELS[Math.min(l,LEVELS.length-1)], pct:(p.xp%200)/2}; }
function addXP(n, why){
  const p=P(); const before=lvl(p).i; p.xp+=n; save();
  toast("+"+n+" XP", why);
  if(lvl(p).i>before) setTimeout(()=>sheet(`<div class="grab"></div><p class="eyebrow center">Ново ниво</p><div class="badge-pop">${esc(lvl(p).name)}</div><p class="center muted">Всеки ден малко по-добре. Продължавай така, ${esc(p.name)}.</p><button class="btn block" data-close>Напред</button>`),900);
}
function markWorkoutDone(){
  const p=P(); const t=todayISO();
  if(p.log[t]?.complete) return;
  p.log[t] = Object.assign(p.log[t]||{}, {complete:true});
  const y=new Date(Date.now()-864e5);
  p.streak = (p.lastDone && (Date.now()-new Date(p.lastDone+"T00:00:00"))/864e5 <= 4) ? p.streak+1 : 1;
  p.lastDone=t; save(); addXP(50,"Тренировката е завършена. Серия: "+p.streak);
}

  if(!minor && !bp) before.push("Кафе по желание, 30–60 мин преди — ако го понасяш добре");
  const during = ["Вода 150–250 мл на всеки 15–20 мин"];
  if(p.minutes>=60 || modeOf(p)==="burn") during.push("Електролити (натрий, калий, магнезий) при тренировка над 60 мин или силно потене");
  const after = ["Протеин 20–40 г до 2 ч след тренировка","Въглехидрати за възстановяване (ориз, картофи, плод)"];
  if(!minor){ after.push("Магнезий вечер — помага за съня и мускулите"); after.push("Витамин D през есента и зимата — след изследване"); after.push("Креатин 3–5 г дневно — най-изследваната добавка за сила"); after.push("Омега-3 при малко риба в менюто"); }
  return `<div class="supp">
    <div><h4 style="color:var(--accent)">Преди</h4><ul>${before.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>

  </div>${(p.allergies||[]).length?`<p class="note" style="color:var(--hot);font-weight:800;margin:0">Твоите алергии: ${esc(p.allergies.map(a=>ALLERGENS[a]).join(", "))} — избери продукти без тях (Свят → Добавки).</p>`:""}<p class="note">Общи насоки, не лечение. При заболяване, лекарства или бременност се консултирай с лекар преди добавки.${minor?" Под 18 г.: само вода и нормална храна — без добавки.":""}</p>`;
}

function bodyChallenge(p){
  const lst = p.age>=55||p.level==="new"
   ? ["8 000 крачки днес","2 мин планк общо за деня (на части)","10 мин разтягане преди сън","Без сладки напитки днес"]

let scanFile=null, scanURL="", scanRes=null, scanCtl=null, scanState="idle", scanErr="";

function rScan(){

    ${!aiReady()&&NATIVE?`<button class="btn ghost block" id="aiSetup" type="button">Включи AI разпознаване</button>`:""}
    ${!aiReady() ? `<p class="note">${scanFile?"Кой уред е на снимката? Избери го от списъка по-долу и FIT ще ти покаже упражненията за твоя профил.":"Снимай уреда, за да го запомниш, после го избери от списъка — FIT ще ти даде упражненията за твоя профил."}</p>`:""}

let pickedEq=null;
function manualCard(p){
  const e=LIB[pickedEq]; const inGym=(p.gym||[]).includes(pickedEq);
  const items=e.ex.slice(0,10).map(x=>{ const ok=allowed(x,p); const [s,r]=presc(p,x[2]); return `<div class="ex"><div class="num">${GROUP_N[x[2]].slice(0,2)}</div><div style="min-width:0"><div class="ex-name">${esc(x[0])}</div><div class="ex-meta">${esc(x[1])}</div><div class="presc">${esc(s)} · ${esc(r)}</div><div class="ex-meta">${ok?esc(x[3]):`<span style="color:var(--hot);font-weight:800">Пропусни заради ограничение: ${esc(x[4].split(",").filter(f=>p.limits.includes(f)).map(f=>LIMITS[f]).join(", "))}</span>`}</div></div><span></span></div>`; }).join("");
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">${esc(e.n)}</h2><span class="pill accent">${MODES[modeOf(p)].n}</span></div><div>${items}</div>

function scanCard(p){

function guessGroup(m){ m=(m||"").toLowerCase();
  if(/кардио|сърц/.test(m)) return "cardio"; if(/гръб|гръбен|лопат/.test(m)) return "back"; if(/гърд/.test(m)) return "chest";
  if(/рамен|делт/.test(m)) return "shoulders"; if(/бицепс|трицепс|предмиш/.test(m)) return "arms"; if(/корем|кръст|кос/.test(m)) return "core"; return "legs"; }
function addScanned(){
  const p=P(), r=scanRes; const id="c"+Date.now();
  p.custom=p.custom||[]; p.custom.push({id, n:r.equipment, ex:(r.exercises||[]).slice(0,10).map(x=>[x.name, x.muscles||"", guessGroup(x.muscles), x.cue||"", ""])});
  toggleGym(id,true); addXP(10,"Нов уред в твоя фитнес: "+r.equipment); scanRes=null; scanFile=null; scanState="idle"; rScan();
}
function toggleGym(id,on){ const p=P(); p.gym=p.gym&&p.gym.length?p.gym:[]; const i=p.gym.indexOf(id); if(on&&i<0)p.gym.push(id); if(!on&&i>=0)p.gym.splice(i,1); save(); }
async function analyze(){
  if(!aiReady()||!scanFile) return;
  const p=P(); const m=MODES[modeOf(p)];
  scanCtl=new AbortController(); scanState="busy"; scanRes=null; rScan();
  const prompt = `Ти си опитен фитнес треньор на начинаещи в България. Снимката показва уред във фитнес зала.

Ограничения: ${p.limits.length?p.limits.map(f=>LIMITS[f]).join(", "):"няма"}.
Режим: ${m.n} — серии/повторения около ${m.sets[phaseIdx(weekNo(p))]} × ${m.reps}, почивка ${m.rest}. Седмица ${weekNo(p)} от 12-седмична програма.
Задача: разпознай уреда и дай до 10 упражнения на него, подходящи за този човек и режим. Пропусни упражнения, опасни при неговите ограничения. Пиши на български, кратко.
Отговори САМО с JSON във вида:
{"equipment":"име на уреда на български или празно, ако не е фитнес уред","confidence":"висока|средна|ниска","what":"едно изречение какво тренира","setup":["до 3 кратки настройки"],"exercises":[{"name":"","muscles":"","sets":"3 × 10–12","rest":"60–90 с","cue":"кратка техника"}],"safety":"едно изречение"}`;
  try{
    scanRes = await aiScan(scanFile,prompt,scanCtl.signal);
    scanState="idle"; if(scanRes?.equipment) addXP(10,"Разпознат уред: "+scanRes.equipment);
  }catch(e){
    if(e.code==="cancelled"){ scanState="idle"; }
    else { scanState="err"; scanErr = e.code==="not_granted"?"Не е разрешено FIT да използва Claude.":e.code==="rate_limited"?"Твърде много заявки — опитай след малко.":e.code==="image_rejected"?"Снимката не става — опитай с друга.":e.code==="bad_key"?"Ключът за Claude API не е валиден — провери го в менюто → AI разпознаване.":e.code==="not_configured"?"AI разпознаването не е включено — меню → AI разпознаване.":"Временен проблем. Опитай отново."; if(["not_granted","sampling_disabled","images_unavailable"].includes(e.code)) SAMPLE_IMG=false; }
  }
  rScan();
}

function gearTip(p){
  const t=(p.events||[]).find(e=>e.id===p.target);
  if(t?.type==="hike") return "За поход: обувки с твърда подметка, раница 25–35 л, ветровка и щеки. Разходи обувките поне 3 седмици преди прехода.";
  if(t?.type==="run"||t?.type==="trail") return "За бягане: обувки според стъпката ти (пробвай в магазина следобед, когато стъпалото е по-голямо), технически чорапи, тениска без памук.";
  if(t?.type==="climb") return "За катерене: започни с обувки под наем в залата. Купи свои след 4–5 посещения, когато знаеш размера и стила си.";

}

let WX=null, WXbusy=false, WXerr="", WXat=0;
function cityOf(){ const n=(S.city)||"София"; return CITIES.find(c=>c[0]===n)||CITIES[0]; }
async function loadWeather(force){
  if(WXbusy || (!force && ((WX && Date.now()-WXat<30*60e3) || WXerr))) return;
  const [name,lat,lon]=cityOf(); WXbusy=true; WXerr="";
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_gusts_10m,uv_index,pressure_msl&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max,sunrise,sunset,wind_speed_10m_max&timezone=Europe%2FSofia&forecast_days=7`;
    const a=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5,european_aqi`;
    const [w,q]=await Promise.all([fetch(u).then(r=>r.json()), fetch(a).then(r=>r.json()).catch(()=>null)]);
    if(!w||!w.current) throw new Error("no data");
    WX={city:name,w,q:q&&q.current?q.current:null}; WXat=Date.now();
    setTimeout(()=>{ if(TAB==="today"){ if(NATIVE) natPopup(); else ideaPopup(); } scheduleNotifs(); },0);
  }catch(e){ WXerr = NATIVE ? "Няма връзка с прогнозата. Провери интернета и опитай пак." : "Подробното време работи в приложението FIT за Android."; }
  WXbusy=false;
  if(TAB==="world"&&worldSeg==="weather") rWorld(); else if(TAB==="today") rToday();
}
function aqiText(v){ if(v==null) return ["—",""]; if(v<=20) return ["Отличен","good"]; if(v<=40) return ["Добър","good"]; if(v<=60) return ["Умерен","accent"]; if(v<=80) return ["Лош","hot"]; return ["Много лош","hot"]; }
function trainAdvice(){
  if(!WX) return "";
  const c=WX.w.current, t=c.apparent_temperature, uv=c.uv_index||0, wind=c.wind_gusts_10m||0, code=c.weather_code, aq=WX.q?WX.q.european_aqi:null;
  const tips=[];
  if(code>=95) tips.push("Буря — тренирай вътре.");
  else if(code>=61&&code<=82) tips.push("Вали — днес залата е по-добрият избор.");
  if(t>=30) tips.push("Горещо: тренирай рано сутрин или вечер, пий 500 мл вода повече и добави електролити.");
  else if(t<=0) tips.push("Студено: загрявай 10 мин вътре, облечи се на пластове, пази дланите и ушите.");
  else if(t>=12&&t<=24&&code<61) tips.push("Отлично време за бягане или разходка навън след залата.");
  if(uv>=6) tips.push("Висок UV индекс — слънцезащита и шапка, ако си навън между 11 и 16 ч.");
  if(wind>=50) tips.push("Силни пориви на вятъра — избягвай колело и планина днес.");
  if(aq!=null&&aq>60) tips.push("Въздухът е замърсен — тренирай на закрито.");
  return tips.join(" ")||"Нормални условия — тренирай по план.";
}
function hhmm(iso){ return iso? iso.slice(11,16):""; }

/* ============ AI РАЗПОЗНАВАНЕ (APK) ============ */
const AI_MODEL = "claude-sonnet-5-5";
function aiCfg(){ return S.ai||{}; }
function aiReady(){ const a=aiCfg(); return !!(SAMPLE_IMG || a.url || a.key); }
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}
function parseJSONLoose(t){ const a=t.indexOf("{"), b=t.lastIndexOf("}"); if(a<0||b<a) throw {code:"invalid_json"}; return JSON.parse(t.slice(a,b+1)); }
async function aiScan(file, prompt, signal){
  if(SAMPLE && SAMPLE_IMG) return SAMPLE.json(prompt,{images:[file],signal});
  const a=aiCfg(); const data=await shrinkImage(file);
  if(a.url){
    const r=await fetch(a.url,{method:"POST",signal,headers:{"content-type":"application/json"},body:JSON.stringify({image:data,prompt})});
    if(!r.ok) throw {code:r.status===429?"rate_limited":"upstream_error"};
    const j=await r.json(); return parseJSONLoose(j.text||"");
  }
  if(a.key){
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:1800,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data}},{type:"text",text:prompt}]}]})});
    if(r.status===401) throw {code:"bad_key"};
    if(!r.ok) throw {code:r.status===429?"rate_limited":"upstream_error"};
    const j=await r.json(); return parseJSONLoose((j.content||[]).map(c=>c.text||"").join(""));
  }
  throw {code:"not_configured"};
}

const IDEAS_OUT = ["Бърза разходка 30 минути в парка","Колело 45 минути в спокойно темпо","Лек крос 20–30 минути","Поход до близкия връх или хижа","Скандинавско ходене 40 минути","Футбол или баскетбол с приятели","Изкачване по стълби на открито — 10 серии"];
const IDEAS_IN = ["Плуване 30 минути на закрито","Йога или стречинг 25 минути вкъщи","Катерачна зала — пробна тренировка","Групова тренировка в залата","Тренировка с тегло на тялото: 4 кръга клек, лицеви опори, планк","Пътека с наклон 30 минути в залата","Мобилност за гръб и рамене — 15 минути"];
function dayIdea(code, tmax, wind, dayIdx){
  const bad = code>=61 || code===45 || code===48 || tmax>=33 || tmax<=-3 || wind>=50;
  const why = code>=95?"буря":code>=71&&code<=86?"сняг":code>=61?"дъжд":(code===45||code===48)?"мъгла":tmax>=33?"жега":tmax<=-3?"студ":wind>=50?"силен вятър":"";
  const list = bad?IDEAS_IN:IDEAS_OUT; const idea=list[(new Date().getDate()+dayIdx)%list.length];
  return {bad, why, idea};
}
function ideaToday(){
  if(!WX) return null; const d=WX.w.daily; return dayIdea(d.weather_code[0], d.temperature_2m_max[0], d.wind_speed_10m_max[0], 0);
}

  const id=ideaToday(); const p=P(); if(!id||!p) return;

    }); dropSound(); }, 1800);

/* ============ ИЗВЕСТИЯ (ANDROID) ============ */
function notifCfg(){ return Object.assign({on:true, morning:"08:30", evening:"17:30"}, S.notif||{}); }
async function scheduleNotifs(){
  const LN=Plug("LocalNotifications"); const p=P(); if(!NATIVE||!LN||!p) return;
  const cfg=notifCfg();
  try{
    const pend=await LN.getPending(); if(pend&&pend.notifications&&pend.notifications.length) await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(!cfg.on) return;
    let perm=await LN.checkPermissions(); if(perm.display!=="granted") perm=await LN.requestPermissions(); if(perm.display!=="granted") return;
    try{ await LN.createChannel({id:"fit_drop",name:"FIT",description:"Тренировки, часове, свободни места и идеи",importance:4,sound:"drop.wav",vibration:true,visibility:1}); }catch(e){}
    const out=[]; const [mh,mm]=cfg.morning.split(":").map(Number), [eh,em]=cfg.evening.split(":").map(Number);
    for(let i=1;i<=7;i++){
      const day=new Date(); day.setDate(day.getDate()+i);
      const dow=day.getDay();
      if(trainingDays(p).includes(dow)){
        const at=new Date(day); at.setHours(mh,mm,0,0);
        const di=dayIndexFor(p,dow); const n=buildDay(p,di).list.length;
        out.push({id:1000+i,title:"Днес тренираме",body:`${SPLIT_N[SPLITS[p.days][di%SPLITS[p.days].length]]} · ${n} уреда · ~${p.minutes} мин. По-силни днес.`,schedule:{at,allowWhileIdle:true}});
      }
      const at2=new Date(day); at2.setHours(eh,em,0,0);
      let title="Идея за активност", body=IDEAS_OUT[(day.getDate())%IDEAS_OUT.length];
      const natC=(typeof natCandidates==="function")?natCandidates().filter(x=>natFit(x,null).ok):[];
      if(WX){ const d=WX.w.daily; if(i<d.time.length){ const id=dayIdea(d.weather_code[i], d.temperature_2m_max[i], d.wind_speed_10m_max[i], i); title=id.bad?"Форсмажор: "+id.why:"Хубаво време навън"; body=id.idea+(id.bad?" — на закрито.":" — излез навън."); if(!id.bad&&natC.length){ const x=natC[i%natC.length]; body=x.name+" ("+distText(x.km).km+" км) — "+natFit(x,null).act; } } }
      out.push({id:2000+i,title,body,schedule:{at:at2,allowWhileIdle:true}});
    }
    (p.events||[]).forEach((e,k)=>{ [7,1].forEach(b=>{ const at=new Date(e.date+"T09:00:00"); at.setDate(at.getDate()-b); if(at>new Date()) out.push({id:3000+k*10+b,title:b===1?"Утре: "+e.name:"След седмица: "+e.name,body:b===1?"Лек ден, вода и ранен сън. Успех!":"Последна седмица подготовка — не прекалявай с натоварването.",schedule:{at,allowWhileIdle:true}}); }); });
    const now=new Date();
    (p.classes||[]).forEach((c,k)=>{ const at=new Date(c.at);
      const eve=new Date(at); eve.setDate(eve.getDate()-1); eve.setHours(20,0,0,0);
      if(eve>now) out.push({id:4000+k*10,title:"Утре: "+c.type,body:c.studio+" · "+fmtWhen(c.at)+". Приготви кърпа, вода и чорапи с грип.",schedule:{at:eve,allowWhileIdle:true}});
      const b2=new Date(at.getTime()-2*3600e3); if(b2>now) out.push({id:4001+k*10,title:"След 2 часа: "+c.type,body:c.studio+" — тръгни навреме.",schedule:{at:b2,allowWhileIdle:true}}); });
    (p.watches||[]).forEach((w,k)=>{ const end=new Date(w.at); let t=new Date(now.getTime()+w.every*3600e3); let n=0;
      while(t<end && n<30){ const h=t.getHours(); if(h>=8&&h<=21){ out.push({id:5000+k*50+n,title:"Провери за свободно място",body:w.type+" · "+w.studio+" · "+fmtWhen(w.at),schedule:{at:new Date(t),allowWhileIdle:true}}); n++; } t=new Date(t.getTime()+w.every*3600e3); } });
    out.forEach(n=>{ n.channelId="fit_drop"; n.sound="drop.wav"; });
    if(out.length) await LN.schedule({notifications:out});
  }catch(e){}
}

let MYPOS=null, MYPOSat=0;
async function myPosition(){
  if(MYPOS && Date.now()-MYPOSat<5*60e3) return MYPOS;
  const G=Plug("Geolocation");
  try{
    if(NATIVE && G){
      let pm=await G.checkPermissions(); if(pm.location!=="granted") pm=await G.requestPermissions(); if(pm.location!=="granted") return null;
      const r=await G.getCurrentPosition({enableHighAccuracy:false,timeout:12000,maximumAge:120000});
      MYPOS={lat:r.coords.latitude,lon:r.coords.longitude};
    } else if(navigator.geolocation){
      MYPOS=await new Promise((res)=>navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}),()=>res(null),{timeout:10000,maximumAge:120000}));
    }
  }catch(e){ MYPOS=null; }
  if(MYPOS) MYPOSat=Date.now(); return MYPOS;
}

function geoSave(c){ try{ localStorage.setItem("fit_geo",JSON.stringify(c)); }catch(e){} }
let geoQueue=Promise.resolve();
function geocode(q){
  const c=geoCache(); if(c[q]) return Promise.resolve(c[q]);
  // OpenStreetMap Nominatim — по една заявка в секунда
  geoQueue=geoQueue.then(async()=>{
    const cc=geoCache(); if(cc[q]) return cc[q];
    try{
      const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=bg&accept-language=bg&q="+encodeURIComponent(q));
      const j=await r.json(); await new Promise(x=>setTimeout(x,1100));
      if(j&&j[0]){ cc[q]={lat:+j[0].lat,lon:+j[0].lon}; geoSave(cc); return cc[q]; }
    }catch(e){}
    return null;
  });
  return geoQueue;
}
function kmBetween(a,b){ const R=6371,t=x=>x*Math.PI/180; const dl=t(b.lat-a.lat), dn=t(b.lon-a.lon); const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function distText(km){ const road=km*1.3; const walk=Math.round(road/4.8*60), car=Math.max(3,Math.round(road/28*60));
  return {km:road.toFixed(road<10?1:0).replace(".",","), walk: walk>=90? Math.round(walk/60*10)/10+" ч" : walk+" мин", car: car+" мин"}; }
function navLinks(dest){
  const d=encodeURIComponent(dest.coords? dest.coords.lat+","+dest.coords.lon : dest.q);
  return {
    gWalk:"https://www.google.com/maps/dir/?api=1&travelmode=walking&destination="+d,
    gCar:"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+d,
    gTransit:"https://www.google.com/maps/dir/?api=1&travelmode=transit&destination="+d,

}

/* ============ НАВЪН ОКОЛО МЕН — ПАРКОВЕ, ГОРИ, ЕЗЕРА, ВЪРХОВЕ (GPS) ============ */
const NAT_T = {park:"Парк", forest:"Гора", lake:"Езеро", dam:"Язовир", sea:"Море / плаж", peak:"Връх", hut:"Хижа", ski:"Ски зона", reserve:"Природна зона"};
function season(d){ const m=(d||new Date()).getMonth(); return m<=1||m===11?"winter":m<=4?"spring":m<=7?"summer":"autumn"; }
const SEASON_N={winter:"зима",spring:"пролет",summer:"лято",autumn:"есен"};
let NAT=null, NATbusy=false, NATerr="", natPick=0;
function natCacheKey(me){ return "fit_nat_"+me.lat.toFixed(2)+"_"+me.lon.toFixed(2); }
async function loadNature(force){
  if(NATbusy) return NAT;
  NATbusy=true; NATerr="";
  try{
    const me=await myPosition();
    if(!me){ NATerr=NATIVE?"Разреши местоположение, за да намеря места около теб.":"Местата около теб се показват в приложението FIT за Android."; return null; }
    const key=natCacheKey(me);
    if(!force){ try{ const c=JSON.parse(localStorage.getItem(key)||"null"); if(c&&Date.now()-c.at<6*3600e3){ NAT={me,list:c.list}; return NAT; } }catch(e){} }
    const q=`[out:json][timeout:25];(
      way["leisure"="park"]["name"](around:7000,${me.lat},${me.lon});
      relation["leisure"="park"]["name"](around:7000,${me.lat},${me.lon});
      way["landuse"="forest"]["name"](around:20000,${me.lat},${me.lon});
      way["natural"="wood"]["name"](around:20000,${me.lat},${me.lon});
      way["natural"="water"]["name"]["water"~"lake|reservoir"](around:30000,${me.lat},${me.lon});
      relation["natural"="water"]["name"]["water"~"lake|reservoir"](around:30000,${me.lat},${me.lon});
      node["natural"="peak"]["name"](around:30000,${me.lat},${me.lon});
      relation["boundary"="protected_area"]["name"](around:35000,${me.lat},${me.lon});
      relation["leisure"="nature_reserve"]["name"](around:35000,${me.lat},${me.lon});
      way["natural"="beach"]["name"](around:60000,${me.lat},${me.lon});
      node["natural"="beach"]["name"](around:60000,${me.lat},${me.lon});
      node["tourism"="alpine_hut"]["name"](around:40000,${me.lat},${me.lon});
      way["tourism"="alpine_hut"]["name"](around:40000,${me.lat},${me.lon});
      way["landuse"="winter_sports"]["name"](around:90000,${me.lat},${me.lon});
      relation["landuse"="winter_sports"]["name"](around:90000,${me.lat},${me.lon});
    );out center tags 120;`;
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"content-type":"application/x-www-form-urlencoded"}});
    const j=await r.json(); const seen=new Set(); const list=[];
    (j.elements||[]).forEach(e=>{
      const t=e.tags||{}; const name=t["name:bg"]||t.name; if(!name||seen.has(name)) return;
      const c=e.center||(e.lat?{lat:e.lat,lon:e.lon}:null); if(!c) return;
      const type= t.leisure==="park"?"park": (t.landuse==="forest"||t.natural==="wood")?"forest": t.natural==="water"?(t.water==="reservoir"?"dam":"lake"): t.natural==="beach"?"sea": t.natural==="peak"?"peak": t.tourism==="alpine_hut"?"hut": t.landuse==="winter_sports"?"ski":"reserve";
      seen.add(name); const km=kmBetween(me,{lat:c.lat,lon:c.lon});

  finally{ NATbusy=false; }
}
// подходящо ли е мястото сега: сезон + времето
function natFit(x, wx){
  const s=season(); const c=wx?wx.w.current:null; const d=wx?wx.w.daily:null;
  const code=c?c.weather_code:2, t=c?c.apparent_temperature:15, wind=c?(c.wind_gusts_10m||0):10, snow=code>=71&&code<=86;
  const storm=code>=95, rain=code>=61&&code<=82&&!snow, fog=code===45||code===48;
  let ok=true, why="", act="";
  const acts={
    park:{winter:snow?"Разходка в снега — 40 минути бързо ходене":"Бързо ходене 30–40 минути",spring:"Лек крос или ролери",summer:t>=28?"Бягане рано сутрин или вечер в сянка":"Бягане и упражнения на открито",autumn:"Разходка сред есенните листа и стречинг"},
    forest:{winter:snow?"Зимна разходка с подходящи обувки":"Скандинавско ходене по горските пътеки",spring:"Поход по еко пътека",summer:"Поход в сянката на гората — по-хладно от града",autumn:"Есенен поход — най-красивият сезон в гората"},
    lake:{winter:"Разходка около водата — внимавай с леда",spring:"Колело около езерото",summer:t>=26?"Колело или гребане — освежаване до водата":"Колело и разходка до водата",autumn:"Разходка и колело край водата"},
    peak:{winter:"Само с опит, екипировка и водач — иначе избери по-ниско място",spring:"Поход до върха, ако пътеките са сухи",summer:"Поход до върха — тръгни рано, вземи вода и яке",autumn:"Поход до върха — провери кога се стъмва"},
    dam:{winter:"Разходка около язовира — внимавай с леда",spring:"Колело по пътя около язовира",summer:t>=26?"Колело и разходка; къпане само на разрешени места":"Колело и разходка до водата",autumn:"Разходка и колело край язовира"},
    sea:{winter:"Разходка по брега — свеж морски въздух",spring:"Бягане по пясъка — тренира и прасците",summer:t>=24?"Плуване и плажен волейбол — следи флаговете на спасителите":"Бягане и разходка по плажа",autumn:"Разходка и бягане по брега"},
    hut:{winter:"Само с опит и екипировка — иначе избери по-ниско място",spring:"Поход до хижата — провери пътеката за сняг",summer:"Поход до хижата и обяд там",autumn:"Поход до хижата — тръгни рано, стъмва се по-рано"},
    ski:{winter:snow||t<=3?"Ски или сноуборд — загрей 10 минути преди първото спускане":"Разходка в планината",spring:"Поход или планинско колело",summer:"Поход, лифт и планинско колело",autumn:"Поход в планината"},
    reserve:{winter:"Кратка разходка по маркираните пътеки",spring:"Еко пътека и наблюдение на природата",summer:"Еко пътека рано сутрин",autumn:"Еко пътека сред есенните цветове"}
  };
  act=acts[x.type][s];
  if(storm){ ok=false; why="буря"; }
  else if(rain){ ok=false; why="дъжд"; }
  else if(fog&&(x.type==="peak"||x.type==="forest")){ ok=false; why="мъгла"; }
  else if(wind>=50&&/peak|lake|dam|sea|hut|ski/.test(x.type)){ ok=false; why="силен вятър"; }
  else if(x.type==="ski"&&s!=="winter"&&s!=="summer"){ ok=true; }
  else if(t>=33&&(x.type==="peak"||x.type==="park")){ ok=false; why="жега — избери гора или вода"; }
  else if(s==="winter"&&(x.type==="peak"||x.type==="hut")){ ok=false; why="зимни условия в планината"; }
  else if(x.type==="sea"&&s==="summer"&&t<20){ ok=true; }
  else if(t<=-8){ ok=false; why="силен студ"; }
  return {ok, why, act, s};
}
function natCandidates(){
  if(!NAT) return [];
  const sBoost={winter:{ski:-40},summer:{sea:-30,lake:-10,dam:-10,forest:-5},spring:{park:-5},autumn:{forest:-15,hut:-10}}[season()]||{};
  const score=x=>{ const f=natFit(x,WX); return (f.ok?0:1000)+x.km*(x.type==="park"?1.4:/peak|hut|ski|sea/.test(x.type)?0.5:0.8)+(sBoost[x.type]||0); };
  return NAT.list.slice().sort((a,b)=>score(a)-score(b));
}

  const mine=(P().places||[]).filter(o=>/Фитнес|Пилатес|Басейн/.test(o.type||""));

}

function natureHTML(){

function onboarding(isNew, edit){
  const d = edit ? Object.assign({goals:goalsOf(edit)}, JSON.parse(JSON.stringify(edit))) : {name:"",age:30,sex:"m",height:175,weight:80,goal:"fat",goals:["fat"],level:"new",days:3,minutes:50,limits:[],value:"disc"};
  let step=0;
  const steps = [
    ()=>`<p class="eyebrow">Стъпка 1 от 4 · Кой си ти</p><div class="h-display">${isNew&&S.people.length?"Нов човек във FIT":"Добре дошъл във FIT"}</div>

      <label class="f">Име<input class="in" id="o-name" value="${esc(d.name)}" placeholder="Например: Ники" autocomplete="given-name"></label>
      <div class="grid2"><label class="f">Възраст<input class="in mono" id="o-age" type="number" min="12" max="95" value="${d.age}"></label>
      <label class="f">Пол<select class="in" id="o-sex"><option value="m" ${d.sex==="m"?"selected":""}>Мъж</option><option value="f" ${d.sex==="f"?"selected":""}>Жена</option></select></label>
      <label class="f">Ръст, см<input class="in mono" id="o-h" type="number" min="120" max="230" value="${d.height}"></label>
      <label class="f">Тегло, кг<input class="in mono" id="o-w" type="number" min="30" max="250" value="${d.weight}"></label></div>`,
    ()=>`<p class="eyebrow">Стъпка 2 от 4 · Посока</p><div class="h-display">Къде искаш да стигнеш за 12 седмици?</div>
      <p class="muted" style="margin:0">Избери до 3 цели.</p>
      <div class="chips">${Object.entries(GOALS).map(([k,g])=>`<button class="chip" type="button" data-g="${k}" aria-pressed="${d.goals.includes(k)}">${g.n}</button>`).join("")}</div>
      ${d.goals.includes("fat")&&d.goals.includes("muscle")?`<p class="note" style="color:var(--ink)"><b>Рекомпозиция:</b> сваляш мазнини и трупаш мускули едновременно. Работи най-добре при начинаещи: силови тренировки, лек калориен дефицит и много протеин.</p>`:""}
      ${d.goals.includes("posture")&&d.goals.length>1?`<p class="note" style="color:var(--ink)"><b>Стойка и гръб</b> се добавя към всяка тренировка: 2 упражнения за горен гръб, лопатки и кръст.</p>`:""}
      <p class="eyebrow" style="margin-top:6px">Опит</p>
      <div class="chips">${[["new","Никога не съм тренирал"],["mid","Тренирал съм преди"],["adv","Тренирам редовно"]].map(([k,n])=>`<button class="chip" type="button" data-l="${k}" aria-pressed="${k===d.level}">${n}</button>`).join("")}</div>`,
    ()=>`<p class="eyebrow">Стъпка 3 от 4 · Време и тяло</p><div class="h-display">Колко време имаш?</div>
      <div class="grid2"><label class="f">Тренировки седмично<select class="in" id="o-days">${[2,3,4,5].map(n=>`<option ${n===d.days?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="f">Минути на тренировка<select class="in" id="o-min">${[30,40,50,60,75,90].map(n=>`<option ${n===d.minutes?"selected":""}>${n}</option>`).join("")}</select></label></div>
      <p class="eyebrow" style="margin-top:6px">Нещо, което да пазим?</p>
      <div class="chips">${Object.entries(LIMITS).map(([k,n])=>`<button class="chip" type="button" data-lim="${k}" aria-pressed="${d.limits.includes(k)}">${n}</button>`).join("")}</div>
      <p class="note">FIT ще пропуска рискови упражнения. При заболяване първо говори с лекар.</p>`,
    ()=>`<p class="eyebrow">Стъпка 4 от 4 · По-добър човек</p><div class="h-display">Върху какво работиш извън залата?</div>
      <div class="chips">${Object.entries(VALUES).map(([k,v])=>`<button class="chip" type="button" data-v="${k}" aria-pressed="${k===d.value}">${v.n}</button>`).join("")}</div>
      <p class="muted" style="margin:0">Всеки ден FIT ще ти дава малко действие за тялото и малко за характера.</p>`
  ];
  function paint(){
    sheet(`<div class="grab"></div><div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>${steps[step]()}
      <div class="row">${step>0?`<button class="btn ghost" id="o-back" type="button">Назад</button>`:(S.people.length?`<button class="btn ghost" data-close type="button">Отказ</button>`:"")}<button class="btn" id="o-next" type="button" style="flex:1">${step<3?"Напред":"Готово, давай!"}</button></div>`, host=>{
      host.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const k=b.dataset.g; if(d.goals.includes(k)){ if(d.goals.length>1) d.goals=d.goals.filter(x=>x!==k); } else { if(d.goals.length>=3) d.goals.shift(); d.goals.push(k); } d.goal=d.goals[0]; paint(); });
      host.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ d.level=b.dataset.l; paint(); });
      host.querySelectorAll("[data-lim]").forEach(b=>b.onclick=()=>{ const k=b.dataset.lim; d.limits=d.limits.includes(k)?d.limits.filter(x=>x!==k):[...d.limits,k]; grab(); paint(); });
      host.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ d.value=b.dataset.v; paint(); });
      const bk=$("#o-back"); if(bk) bk.onclick=()=>{ grab(); step--; paint(); };
      $("#o-next").onclick=()=>{ grab();
        if(step===0 && !d.name.trim()){ $("#o-name").focus(); $("#o-name").placeholder="Как да те наричаме?"; return; }
        if(step<3){ step++; paint(); return; }
        finish(); };
      const n=$("#o-name"); if(n && !d.name) n.focus();
    });
  }
  function grab(){
    const v=id=>document.getElementById(id);
    if(v("o-name")) { d.name=v("o-name").value.trim().slice(0,24); d.age=+v("o-age").value||30; d.sex=v("o-sex").value; d.height=+v("o-h").value||170; d.weight=+v("o-w").value||75; }
    if(v("o-days")) { d.days=+v("o-days").value; d.minutes=+v("o-min").value; }
  }
  function finish(){
    if(edit){ Object.assign(edit, d, {mode:null}); }
    else {
      const p=Object.assign({id:"p"+Date.now(), xp:0, streak:0, lastDone:"", log:{}, gym:[], custom:[], start:todayISO(), mode:null}, d);
      p.perVisit = d.level==="new"?6:(d.minutes>=60?9:7);
      S.people.push(p); S.active=p.id; if(isNew && S.people.length>1) partnerId="";
    }
    save(); closeSheet(); render();
    toast("Програмата е готова", `12 седмици, ${d.days} пъти седмично. Започваме от адаптация.`);
  }
  paint();
}

function localAnswer(q){
  const s=q.toLowerCase(); const p=P(); const has=(...w)=>w.some(x=>s.includes(x));
  if((/(^|\s)ям(\s|$|\?)/.test(s)||has("храна","хран","калори","протеин на ден","меню","mama","мама","диет"))) return {t:"Ориентирът ти за деня и чинията на FIT са в MAMA. След тренировка: 20–40 г протеин и въглехидрати до 2 часа.", go:[goBtn("mama","Храна и MAMA"),goBtn("w:food","Заведения")]};
  if(has("днес","тренир","упражн","програм","серии")) return {t:workoutSummary(), go:[goBtn("today","Днешна тренировка"),goBtn("plan","Цялата програма")]};
  if(has("време","прогноз","дъжд","температур","вали")){ if(WX){ const c=WX.w.current; return {t:`${/^[ВвФф]/.test(WX.city)?"Във":"В"} ${WX.city} сега е ${Math.round(c.temperature_2m)}° (усеща се ${Math.round(c.apparent_temperature)}°), ${WMO[c.weather_code]||""}. ${trainAdvice()}`, go:[goBtn("w:weather","Подробна прогноза")]}; } return {t:"Прогнозата се зарежда в раздела Време.", go:[goBtn("w:weather","Отвори Време")]}; }
  if(has("навън","парк","разход","планин","море","плаж","гора","язовир","хижа","поход","ски","колело")){
    const c=(typeof natCandidates==="function")?natCandidates():[]; const ok=c.filter(x=>natFit(x,WX).ok);
    if(ok.length){ const x=ok[0]; return {t:`Предлагам ${x.name} (${NAT_T[x.type]}, ${distText(x.km).km} км): ${natFit(x,WX).act}.`, go:[goBtn("w:nature","Още места около мен"),goBtn("x:natidea","Дай ми идея")]}; }
    return {t:"Ще намеря паркове, гори, море, планина и язовири около теб по GPS — според сезона и времето.", go:[goBtn("w:nature","Навън около мен")]};
  }
  if(has("пилатес","reformer","реформ","йога","запиш","резерв час","час за")) return {t:"В „Пилатес и часове“ са студиата в София. Натисни „Записах час“, за да ти напомням вечерта преди и 2 часа преди. Ако часът е пълен — „Следи място“ и ще те подсещам да провериш за освободено място.", go:[goBtn("w:pilates","Пилатес и часове")]};
  if(has("свободн","място","пълен")) return {t:"Добави часа в „Следя за свободно място“. Щом въведеш, че местата са например 7/8, веднага излиза прозорец „Има 1 място!“ с бутон за записване.", go:[goBtn("w:pilates","Следи за място")]};
  if(has("заведен","ресторант","rezzo","резерв","обяд","вечеря навън","бранч")) return {t:"В „Заведения“ има подбрани места с отлични отзиви — растителни, поке с протеин, смути и бранч. Резервираш директно в Rezzo.", go:[goBtn("w:food","Заведения")]};
  const sub=SUBST.find(x=>x.n.toLowerCase().split(/[ (\/,]/).some(w=>w.length>3&&s.includes(w)));
  if(sub||has("добавк","витамин","минерал","креатин","кофеин","алерг")){
    if(sub){ const A=p.allergies||[]; const hit=sub.al.filter(a=>A.includes(a)); const lv={ok:"Безопасно",care:"Внимание",danger:"ОПАСНО"}[sub.lvl];
      return {t:`${sub.n} — ${lv}. ${sub.why} ${sub.lvl!=="danger"&&sub.dose?"Доза: "+sub.dose+" ":""}${sub.care?sub.care+" ":""}${hit.length?"Внимание: съдържа "+hit.map(a=>ALLERGENS[a]).join(", ")+", които си отбелязал.":""}`, go:[goBtn("w:subst","Добавки и безопасност")]}; }
    return {t:"В „Добавки“ всичко е маркирано: зелено — безопасно, жълто — внимание, червено — опасно. Отбележи алергиите си и продуктите с тях светват в червено.", go:[goBtn("w:subst","Добавки и безопасност")]};
  }
  if(has("магазин","outlet","аутлет","маратонк","екип","обувк","buzz","decathlon","depot")) return {t:"В „Магазини“ са спортните магазини и outlet-ите в София с бутон „Как да стигна“.", go:[goBtn("w:shops","Магазини и outlet-и")]};
  if(has("фитнес","зала","multisport","мултиспорт","coolfit","карта")) return {t:"В „Фитнеси“ са големите зали в София и картите MultiSport и Coolfit. Можеш да си запишеш цена, карта и паркинг за всяка зала.", go:[goBtn("w:gyms","Фитнеси и карти")]};
  if(has("уред","снима","скенер","машин")) return {t:aiReady()?"Отвори Скенер и снимай уреда — ще получиш до 10 упражнения за твоя профил.":"Отвори Скенер, снимай уреда и го избери от списъка. За автоматично разпознаване включи AI в менюто.", go:[goBtn("scan","Скенер"),goBtn("x:ai","AI разпознаване")]};
  if(has("как да стигна","навигац","waze","google maps","разстояни")) return {t:"При всяко място натисни „Как да стигна“ — разстояние, пеша или с кола, Google Maps или Waze.", go:[goBtn("w:places","Мои обекти")]};
  if(has("обект")) return {t:"„Мои обекти“ пази твоите места, подрежда ги по разстояние и брои посещенията ти.", go:[goBtn("w:places","Мои обекти")]};
  if(has("събити","маратон","ком","емине")) return {t:"В „Събития“ добавяш маратон или поход с дата — FIT брои дните и ти напомня 7 дни и 1 ден преди.", go:[goBtn("w:events","Събития")]};
  if(has("известия","звук","напомн")) return {t:"Известията идват дори когато FIT е затворено, със звук „капка“. Часовете ги сменяш в Известия.", go:[goBtn("x:notif","Известия")]};
  if(has("ниво","xp","точки","серия")){ const L=lvl(p); return {t:`Имаш ${p.xp} XP, ниво „${L.name}“, серия ${p.streak}. Точки получаваш за тренировки, предизвикателства, активности навън и посещения.`, go:[goBtn("w:people","Класиране")]}; }
  if(has("цел","профил","алергии","ограничен")) return {t:`Целта ти е „${goalName(p)}“. Промени я от „Моят профил“.`, go:[goBtn("x:profile","Моят профил")]};
  return null;
}

async function aiText(turns){
  if(SAMPLE){ const r=await SAMPLE(turns,{cache:false,modelTier:"quick"}); return r.text; }
  const a=aiCfg();
  if(a.url){ const r=await fetch(a.url,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({chat:turns})}); if(!r.ok) throw {code:"upstream_error"}; return (await r.json()).text||""; }
  if(a.key){ const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:AI_MODEL,max_tokens:700,system:turns[0].content,messages:turns.slice(1)})}); if(r.status===401) throw {code:"bad_key"}; if(!r.ok) throw {code:"upstream_error"}; const j=await r.json(); return (j.content||[]).map(c=>c.text||"").join(""); }
  throw {code:"not_configured"};
}
function chatAiReady(){ const a=aiCfg(); return !!(SAMPLE||a.url||a.key); }
function parseGo(text){ const go=[]; const t=text.replace(/\[\[([a-z:]+)\]\]/g,(m,k)=>{ const lbl={today:"Днес",plan:"Програма",scan:"Скенер",mama:"Храна и MAMA","w:nature":"Навън около мен","w:pilates":"Пилатес и часове","w:food":"Заведения","w:gyms":"Фитнеси","w:subst":"Добавки","w:shops":"Магазини","w:weather":"Време","w:events":"Събития","w:places":"Мои обекти"}[k]; if(lbl&&go.length<2) go.push({k,label:lbl}); return ""; }); return {t:t.trim(),go}; }
function chatGo(k){ closeSheet();
  if(k.startsWith("w:")){ worldSeg=k.slice(2); show("world"); }
  else if(k==="x:ai") aiSheet(); else if(k==="x:notif") notifSheet(); else if(k==="x:profile") onboarding(false,P());
  else if(k==="x:natidea"){ natPick=0; loadNature().then(()=>showNatSheet(natCandidates())); }
  else show(k); }
function chatBubble(m){ const me=m.role==="user";
  return `<div style="align-self:${me?"flex-end":"flex-start"};max-width:88%;display:flex;flex-direction:column;gap:6px">
    <div style="background:${me?"var(--accent)":"var(--surface-2)"};color:${me?"var(--on-accent)":"var(--ink)"};border:1px solid ${me?"var(--accent)":"var(--line)"};border-radius:16px;padding:10px 12px;white-space:pre-wrap">${esc(m.t)}</div>
    ${(m.go||[]).length?`<div class="row" style="gap:6px">${m.go.map(g=>`<button class="btn ghost sm" type="button" data-chatgo="${g.k}">${esc(g.label)}</button>`).join("")}</div>`:""}</div>`; }
function openChat(){
  if(!CHAT.length) CHAT.push({role:"assistant",t:`Здравей, ${P().name}! Аз съм FIT. Питай ме за тренировката, храната, добавките, времето, места навън, пилатес, заведения или как работи нещо в приложението.`});
  sheet(`<div class="grab"></div><div class="row" style="justify-content:space-between"><div class="h2">Попитай FIT</div><span class="pill ${chatAiReady()?"good":"accent"}">${chatAiReady()?"AI включен":"Помощник"}</span></div>
    <div id="chatLog" style="display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding-right:2px">${CHAT.map(chatBubble).join("")}${chatBusy?`<div class="thinking"><span class="spin"></span>Мисля…</div>`:""}</div>
    <div class="chips" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px">${CHAT_SUGG.map(q=>`<button class="chip" type="button" data-sugg="${esc(q)}" style="flex:0 0 auto">${esc(q)}</button>`).join("")}</div>
    <form id="chatForm" class="row" style="flex-wrap:nowrap"><input class="in" id="chatIn" placeholder="Напиши въпрос…" autocomplete="off" enterkeyhint="send"><button class="btn" type="submit" ${chatBusy?"disabled":""}>Питай</button></form>
    ${chatAiReady()?"":`<p class="note" style="margin:0">За свободен разговор по всякакви теми включи AI от менюто → AI разпознаване. Без него отговарям за всичко в приложението.</p>`}`,host=>{
    const log=$("#chatLog"); log.scrollTop=log.scrollHeight;
    host.querySelectorAll("[data-chatgo]").forEach(b=>b.onclick=()=>chatGo(b.dataset.chatgo));
    host.querySelectorAll("[data-sugg]").forEach(b=>b.onclick=()=>chatSend(b.dataset.sugg));
    $("#chatForm").onsubmit=e=>{ e.preventDefault(); chatSend($("#chatIn").value); };
  });
}
async function chatSend(q){
  q=(q||"").trim().slice(0,600); if(!q||chatBusy) return;
  CHAT.push({role:"user",t:q});
  if(/навън|парк|разход|планин|море|плаж|гора|язовир|хижа|поход|ски|колело/i.test(q) && !NAT && NATIVE){ chatBusy=true; openChat(); await loadNature(); chatBusy=false; }
  const local=localAnswer(q);
  if(local && !(chatAiReady() && q.length>70)){ CHAT.push({role:"assistant",t:local.t,go:local.go}); openChat(); return; }
  if(!chatAiReady()){ CHAT.push({role:"assistant",t:local?local.t:"Мога да помогна с: тренировката днес, програмата, скенера, храната, добавките и алергиите, времето, места навън, пилатес и часове, заведения с Rezzo, магазини, фитнеси, събития и известия. Попитай по-конкретно — например „Къде да изляза навън?“",go:local?local.go:[]}); openChat(); return; }
  chatBusy=true; openChat();
  try{
    const turns=[{role:"user",content:appContext()}];
    CHAT.slice(-10).forEach(m=>turns.push({role:m.role==="user"?"user":"assistant",content:m.t}));
    if(turns[1]&&turns[1].role==="assistant") turns.splice(1,1);
    const merged=[turns[0]]; turns.slice(1).forEach(t=>{ const last=merged[merged.length-1]; if(last.role===t.role) last.content+="\n\n"+t.content; else merged.push(t); });
    const text=await aiText(merged); const pg=parseGo(text||"");
    CHAT.push({role:"assistant",t:pg.t||"Не успях да отговоря.",go:pg.go.length?pg.go:(local?local.go:[])});
  }catch(e){ CHAT.push({role:"assistant",t:(local?local.t+"\n\n":"")+(e.code==="bad_key"?"(Ключът за Claude API не е валиден.)":e.code==="not_granted"?"(Нямам разрешение да питам Claude тук.)":"(AI не отговори в момента — опитай пак.)"),go:local?local.go:[]}); }
  chatBusy=false; if($("#chatLog")||!$("#sheetHost").innerHTML) openChat();
}

let DL=null;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.tab));
$("#menuBtn").onclick=openDrawer;
$("#chatFab").onclick=()=>{ if(P()) openChat(); };
document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ if($("#sheetHost").innerHTML) closeSheet(); show(g.dataset.go); } const nv=e.target.closest("[data-nav]"); if(nv){ const [n,q]=nv.dataset.nav.split("|"); navSheet(n,q); } });
$("#whoBtn").onclick=()=>{
  if(!S.people.length) return;
  sheet(`<div class="grab"></div><p class="eyebrow">Хора</p><div class="h2">Кой тренира сега?</div>
    <div style="display:flex;flex-direction:column;gap:8px">${S.people.map(x=>`<button class="person" type="button" data-pick="${x.id}" aria-pressed="${x.id===S.active}"><span class="ava">${esc(x.name.slice(0,1).toUpperCase())}</span>${esc(x.name)} <span class="muted" style="font-weight:600">· ${esc(goalName(x))}</span></button>`).join("")}</div>
    <button class="btn ghost block" id="addP2" type="button">+ Добави човек</button>`, host=>{
      host.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ S.active=b.dataset.pick; save(); closeSheet(); render(); });
      $("#addP2").onclick=()=>onboarding(true);
  });
};

// пример, докато човекът попълни филтъра — нищо не се записва
if(!S.people.length){
  S.people=[];
  const demo={id:"demo",name:"Гост",age:30,sex:"m",height:178,weight:84,goal:"fat",goals:["fat"],level:"new",days:3,minutes:50,limits:[],value:"disc",xp:0,streak:0,lastDone:"",log:{},gym:[],custom:[],start:todayISO(),mode:null,perVisit:6};
  S.people.push(demo); S.active="demo";
  render();
  S.people=[]; // не записваме госта
  setTimeout(()=>{ S.people=[]; onboarding(false); },300);
} else { render(); dailyPopup(); }

/* ============ ANDROID ============ */
async function openLink(url){ const B=Plug("Browser"); if(NATIVE&&B){ try{ await B.open({url}); return; }catch(e){} } window.open(url,"_blank","noopener"); }
async function openMama(){
  const L=Plug("AppLauncher");
  if(L){ try{ const r=await L.canOpenUrl({url:"bg.ngerchev.mama"}); if(r&&r.value){ await L.openUrl({url:"bg.ngerchev.mama"}); return; } }catch(e){} }
  toast("MAMA","MAMA не е инсталирано на този телефон — отварям изтеглянето.");
  openLink(MAMA_APK);
}
if(NATIVE){
  document.addEventListener("click",e=>{ const a=e.target.closest("a[href]"); if(!a) return; const h=a.getAttribute("href"); if(!/^https?:/.test(h)) return; e.preventDefault(); if(a.hasAttribute("data-mama")) openMama(); else openLink(h); });
  const App=Plug("App");
  if(App) App.addListener("backButton",()=>{ if($("#sheetHost").innerHTML){ if(S.people.length) closeSheet(); return; } if(TAB!=="today"){ show("today"); return; } App.exitApp(); });
  const SB=Plug("StatusBar"); if(SB){ try{ SB.setOverlaysWebView({overlay:false}); SB.setBackgroundColor({color:matchMedia("(prefers-color-scheme: dark)").matches?"#151A22":"#FFFFFF"}); SB.setStyle({style:matchMedia("(prefers-color-scheme: dark)").matches?"DARK":"LIGHT"}); }catch(e){} }
}
(async()=>{
  try{
    DL = await window.claude?.use?.("downloads");
    const s = await window.claude?.use?.("sample");
    if(!s){ if(P()) render(); return; } SAMPLE=s;
    const lim = await s.limits().catch(()=>null);
    SAMPLE_IMG = !!lim?.images;
    if(P()) render();
  }catch(e){}
})();
</script>
